name: QVFilm 5D3.123 baseline / prototype

on:
  push:
    branches:
      - qvfilm/v0.1.0-ui-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare ARM toolchain and newlib headers
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev libnewlib-arm-none-eabi gcc g++ libc6-dev mercurial python3 perl
          arm-none-eabi-gcc --version
          test -f /usr/include/newlib/sys/types.h || find /usr -path '*newlib*/sys/types.h' | head
      - name: Build original upstream fork (master) for baseline
        shell: bash
        run: |
          mkdir -p qvfilm-logs
          git fetch origin master --depth=1
          git worktree add --detach ../qvfilm-base origin/master
          set -o pipefail
          make -C ../qvfilm-base/platform/5D3.123 all PYTHON=python3 2>&1 | tee qvfilm-logs/baseline.log
      - name: Build QVFIL prototype for 5D3.123
        shell: bash
        run: |
          set -o pipefail
          make -C platform/5D3.123 all PYTHON=python3 2>&1 | tee qvfilm-logs/qvfil-core.log
          # Legacy module dependency checker uses Python 2 print syntax.
          # Convert it in the CI checkout only, leaving repository sources unchanged.
          python3 -m lib2to3 -w -n modules/checkdep.py 2>&1 | tee qvfilm-logs/checkdep-python3.log
          make -C modules/mlv_lite all PYTHON=python3 2>&1 | tee qvfilm-logs/qvfil-mlv-lite.log
      - name: Validate original Movie menu and QVFIL registration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('modules/mlv_lite/mlv_lite.c').read_text()
          ui = Path('modules/mlv_lite/qvfilm_ui.inc').read_text()
          assert '#include "qvfilm_ui.inc"' in s
          assert 'menu_add("Movie", raw_video_menu, COUNT(raw_video_menu));' in s
          assert 'qvfilm_register_menu();' in s
          assert 'menu_add("QVFIL", qvfilm_menu, COUNT(qvfilm_menu));' in ui
          assert 'if (cam_5d3_123)' in ui
          assert 'CUSTOM_DRAW_THIS_MENU' in ui
          print("PASS: both Movie and QVFIL menu registrations exist")
          PY
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qvfilm-build-logs
          path: qvfilm-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Attach prototype module for offline review ONLY
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qvfilm-5d3-prototype-NOT-FOR-INSTALLATION
          path: |
            modules/mlv_lite/mlv_lite.mo
          if-no-files-found: error
          retention-days: 7
